<div class="form-container">

    <div class="page-header">

        <h1>Edit Project</h1>

        <p>

            Update project information and management details.

        </p>

    </div>

    <form>

        <div class="section">

            <h2>Project Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Project Name</label>

                    <input
                        type="text"
                        value="Metro Rail Phase-1">

                </div>

                <div class="form-group">

                    <label>Project ID</label>

                    <input
                        type="text"
                        value="PR001">

                </div>

                <div class="form-group">

                    <label>Client Name</label>

                    <input
                        type="text"
                        value="Government of Telangana">

                </div>

                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        value="Hyderabad">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Management Details</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Project Manager</label>

                    <input
                        type="text"
                        value="Rahul Sharma">

                </div>

                <div class="form-group">

                    <label>Site Engineer</label>

                    <input
                        type="text"
                        value="Ajay Kumar">

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select>

                        <option selected>Active</option>
                        <option>Completed</option>
                        <option>On Hold</option>
                        <option>Delayed</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Budget</label>

                    <input
                        type="number"
                        value="25000000">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Timeline</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Start Date</label>

                    <input
                        type="date"
                        value="2026-01-01">

                </div>

                <div class="form-group">

                    <label>Expected End Date</label>

                    <input
                        type="date"
                        value="2026-12-31">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Description</h2>

            <textarea rows="5">Metro Rail Phase-1 is a large-scale urban transportation project connecting major commercial and residential areas.</textarea>

        </div>

        <div class="buttons">

            <button
                type="button"
                class="cancel-btn"
                routerLink="/project-details">

                Cancel

            </button>

            <button
                type="button"
                class="save-btn"
                (click)="updateProject()">

                Update Project

            </button>

        </div>

    </form>

</div>

@if(showSuccessPopup){

<div class="popup-overlay">

    <div class="popup">

        <div class="success-icon">

            ✅

        </div>

        <h2>

            Project Updated Successfully!

        </h2>

        <button
            class="ok-btn"
            (click)="closePopup()">

            OK

        </button>

    </div>

</div>

}
