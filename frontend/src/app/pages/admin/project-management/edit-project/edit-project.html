<div class="form-container">

    <div class="page-header">

        <h1>Edit Project</h1>

        <p>
            Update project information and management details.
        </p>

    </div>

    <form>

        <div class="section">

            <h2>Project Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Project Name</label>

                    <input
                        type="text"
                        name="name"
                        [(ngModel)]="projectData.name">

                </div>

            
     <div class="form-group">
            <select
                    [(ngModel)]="projectData.category"
                    name="category">

                    <option value="Residential">Residential</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Government">Government</option>

        </select>
</div>

                <div class="form-group">

                    <label>Project ID</label>

                    <input
                        type="text"
                        name="project_code"
                        [(ngModel)]="projectData.project_code">

                </div>


                <div class="form-group">

                    <label>Client ID</label>

                    <input
                        type="number"
                        name="client_id"
                        [(ngModel)]="projectData.client_id">

                </div>
                <div class="form-group">


                  <select
                    [(ngModel)]="projectData.priority"
                    name="priority">

                    <option value="High">High</option>
                    <option value="Low">Low</option>
                    <option value="Midiam">Midiam</option>
                    

                    </select>                

                 </div>
                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        [(ngModel)]="projectData.location">

                </div>

            </div>

        </div>


        <div class="section">

            <h2>Management Details</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Project Manager ID</label>

                    <input
                        type="number"
                        name="project_manager_id"
                        [(ngModel)]="projectData.project_manager_id">

                </div>


                <div class="form-group">

                    <label>Site Engineer</label>

                    <input
                        type="text"
                        name="site_engineer"
                        placeholder="Site Engineer">

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select
                        name="status"
                        [(ngModel)]="projectData.status">

                        <option value="Planning">
                            Planning
                        </option>

                        <option value="Active">
                            Active
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="On Hold">
                            On Hold
                        </option>

                        <option value="Delayed">
                            Delayed
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Budget</label>

                    <input
                        type="number"
                        name="estimated_budget"
                        [(ngModel)]="projectData.estimated_budget">

                </div>

            </div>

        </div>


        <div class="section">

            <h2>Timeline</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Start Date</label>

                    <input
                        type="date"
                        name="planned_start_date"
                        [(ngModel)]="projectData.planned_start_date">

                </div>


                <div class="form-group">

                    <label>Expected End Date</label>

                    <input
                        type="date"
                        name="expected_completion_date"
                        [(ngModel)]="projectData.expected_completion_date">

                </div>

            </div>

        </div>


        <div class="section">

            <h2>Description</h2>

            <textarea
                rows="5"
                name="description"
                [(ngModel)]="projectData.description">
            </textarea>

        </div>


        <div class="buttons">

            <button
                type="button"
                class="cancel-btn"
                routerLink="/project-details">

                Cancel

            </button>


            <button
                type="button"
                class="save-btn"
                (click)="updateProject()">

                Update Project

            </button>

        </div>

    </form>

</div>


@if(showSuccessPopup){

    <div class="popup-overlay">

        <div class="popup">

            <div class="success-icon">
                ✅
            </div>

            <h2>
                Project Updated Successfully!
            </h2>

            <button
                type="button"
                class="ok-btn"
                (click)="closePopup()">

                OK

            </button>

        </div>

    </div>

}
