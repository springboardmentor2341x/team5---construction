<div class="form-container">

    <div class="page-header">

        <h1>Add New Project</h1>

        <p>
            Create a new construction project and assign project details.
        </p>

    </div>

    <form>

        <div class="section">

            <h2>Project Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Project Name</label>

                    <input type="text"
                    [(ngModel)]="projectData.name"
                     name="name">

                </div>

Residential
Commercial
Industrial
Infrastructure
Government
                
                 <div class="form-group">

                    <label>category</label>

                  <select
                    [(ngModel)]="projectData.category"
                    name="category">

                    <option value="Residential">Residential</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Government">Government</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>project code</label>

                    <input
                        type="text"
                        [(ngModel)]="projectData.project_code"
                        name="project_code">

                </div>

                <div class="form-group">

                    <label>Client Id</label>

                    <input
                        type="number"
                        [(ngModel)]="projectData.client_id"
                        name="client_id">

                </div>

                <div class="form-group">

                    <label>Location</label>

                    <input
                    type="text"
                    [(ngModel)]="projectData.location"
                    name="location">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Management Details</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label> Project Manager Id</label>

                  <input
  type="number"
  [(ngModel)]="projectData.project_manager_id"
  name="project_manager_id">

                </div>

                <!-- <div class="form-group">

                    <label>Site Engineer</label>

                    <input type="text">

                </div> -->

                <div class="form-group">

                    <label>Status</label>

                  <select
                    [(ngModel)]="projectData.status"
                    name="status">

                    <option value="Planning">Planning</option>
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Delayed">Delayed</option>

                    </select>

                </div>

                 <div class="form-group">

                    <label>priority</label>

                  <select
                    [(ngModel)]="projectData.priority"
                    name="priority">

                    <option value="High">High</option>
                    <option value="Low">Low</option>
                    <option value="Midiam">Midiam</option>
                    

                    </select>

                </div>               

                <div class="form-group">

                    <label>Budget</label>

                  <input
  type="number"
  [(ngModel)]="projectData.estimated_budget"
  name="estimated_budget">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Timeline</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>Start Date</label>

                  <input
  type="date"
  [(ngModel)]="projectData.planned_start_date"
  name="planned_start_date">

                </div>

                <div class="form-group">

                    <label>Expected End Date</label>

                  <input
  type="date"
  [(ngModel)]="projectData.expected_completion_date"
  name="expected_completion_date">

                </div>

            </div>

        </div>

        <div class="section">

            <h2>Description</h2>

          <textarea
  rows="5"
  [(ngModel)]="projectData.description"
  name="description">
</textarea>

        </div>

        <div class="buttons">

            <button
                type="button"
                class="cancel-btn">

                Cancel

            </button>

            <button
                type="button"
                class="save-btn"
                (click)="createProject()">

                Create Project

            </button>

        </div>

    </form>

</div>

@if(showSuccessPopup){

<div class="popup-overlay">

    <div class="popup">

        <div class="success-icon">

            ✅

        </div>

        <h2>

            Project Created Successfully!

        </h2>

        <button
            class="ok-btn"
            (click)="closePopup()">

            OK

        </button>

    </div>

</div>

}
