<h1 class="page-title">Project Management</h1>

<!-- KPI Cards -->
<div class="kpi-grid">

  <mat-card class="kpi-card blue">
    <h4>Total Projects</h4>
    <h2>25</h2>
  </mat-card>

  <mat-card class="kpi-card green">
    <h4>Active</h4>
    <h2>18</h2>
  </mat-card>

  <mat-card class="kpi-card orange">
    <h4>Completed</h4>
    <h2>5</h2>
  </mat-card>

  <mat-card class="kpi-card red">
    <h4>Delayed</h4>
    <h2>2</h2>
  </mat-card>

</div>

<!-- Search + Filters -->

<mat-card class="toolbar">

  <mat-form-field appearance="outline">
    <mat-label>Search Project</mat-label>
    <input matInput placeholder="Search by Name">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>

    <mat-select>
      <mat-option>All</mat-option>
      <mat-option>Planning</mat-option>
      <mat-option>Active</mat-option>
      <mat-option>Completed</mat-option>
      <mat-option>Delayed</mat-option>
    </mat-select>

  </mat-form-field>

  <button mat-raised-button color="primary">
    + New Project
  </button>

</mat-card>

<!-- Projects Table -->

<mat-card>

<table mat-table [dataSource]="projects">

  <!-- Project -->

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Project</th>
    <td mat-cell *matCellDef="let p">{{p.name}}</td>
  </ng-container>

  <!-- Manager -->

  <ng-container matColumnDef="manager">
    <th mat-header-cell *matHeaderCellDef>Manager</th>
    <td mat-cell *matCellDef="let p">{{p.manager}}</td>
  </ng-container>

  <!-- Budget -->

  <ng-container matColumnDef="budget">
    <th mat-header-cell *matHeaderCellDef>Budget</th>
    <td mat-cell *matCellDef="let p">{{p.budget}}</td>
  </ng-container>

  <!-- Progress -->

  <ng-container matColumnDef="progress">
    <th mat-header-cell *matHeaderCellDef>Progress</th>

    <td mat-cell *matCellDef="let p">

      <mat-progress-bar
      mode="determinate"
      [value]="p.progress">
      </mat-progress-bar>

      {{p.progress}}%

    </td>

  </ng-container>

  <!-- Status -->

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>

    <td mat-cell *matCellDef="let p">

      <span class="badge"
      [ngClass]="p.status.toLowerCase()">

      {{p.status}}

      </span>

    </td>

  </ng-container>

  <!-- Actions -->

  <ng-container matColumnDef="actions">

    <th mat-header-cell *matHeaderCellDef>Actions</th>

    <td mat-cell *matCellDef="let p">

      <button mat-icon-button>
        <mat-icon>visibility</mat-icon>
      </button>

      <button mat-icon-button>
        <mat-icon>edit</mat-icon>
      </button>

      <button mat-icon-button>
        <mat-icon>delete</mat-icon>
      </button>

    </td>

  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

</mat-card>
