<div class="projects-page">

    <div class="page-header">

        <h1>Project Management</h1>

        <p>

            Manage all construction projects across the organization.

        </p>

    </div>

    <div class="stats-grid">

        <div class="stat-card">

            <h3>Total project</h3>

            <span> {{project.length}} </span>

        </div>

        <div class="stat-card">

            <h3>Active</h3>

            <span>{{getActiveProjects()}}</span>

        </div>

        <div class="stat-card">

            <h3>Completed</h3>

            <span>{{getCompletedProjects()}}</span>

        </div>

        <div class="stat-card">

            <h3>On Hold</h3>

            <span>{{getOnHoldProjects()}}</span>

        </div>

        <div class="stat-card">

            <h3>Delay</h3>
             

            <span>{{getDelayedProjects()}}</span>

        </div>

       

    </div>

   

</div>

<app-live-project-table></app-live-project-table>
