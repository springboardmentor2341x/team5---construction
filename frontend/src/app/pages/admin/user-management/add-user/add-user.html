<div class="add-user-page">

    <div class="page-header">

        <h1>Add New User</h1>

        <p>Create a new user account and assign roles & permissions.</p>

    </div>

    <div class="form-card">

        <h2>Personal Information</h2>

        <div class="form-grid">



            <div class="form-group">

                <label> Name</label>

                <input
                    type="text"
                    [(ngModel)]="userData.full_name"
                    name="full_name"
                    placeholder="Enter full name">

            </div>

            <div class="form-group full-width">

                <label>Email Address</label>

               <input
    type="email"
    [(ngModel)]="userData.email"
    name="email"
    placeholder="Enter email">

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
    type="text"
    [(ngModel)]="userData.mobile"
    name="mobile"
    placeholder="Enter mobile number">

            </div>

            <div class="form-group">

                <label>Gender</label>

                <select>

                    <option>Select Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

            </div>

        </div>

        <hr>

        <h2>Employment Details</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Role</label>

<select
    [(ngModel)]="userData.role"
    name="role">

    <option value="Administrator">Administrator</option>
    <option value="Project Manager">Project Manager</option>
    <option value="Site Engineer">Site Engineer</option>
    <option value="Contractor">Contractor</option>
    <option value="Worker">Worker</option>
    <option value="Client">Client</option>

</select>

            </div>

            <div class="form-group">

                <label>Department</label>

<input
    type="text"
    [(ngModel)]="userData.department"
    name="department"
    placeholder="Enter department">

            </div>

            <div class="form-group">

                <label>Employee ID</label>

                <input
                    type="text"
                    [(ngModel)]="userData.employee_id"
                    name="employee_id"
                    placeholder="Enter employee ID">

            </div>
            <div class="form-group">

                <label>address </label>

                <textarea
                    [(ngModel)]="userData.address"
                    name="address"
                    placeholder="Enter address">
                </textarea>

            </div>
            <div class="form-group">

                <label>address </label>

<input
    type="file"
    [(ngModel)]="userData.profile_picture"
    name="profile_picture"
    placeholder="Profile picture URL">

            </div>            

            <div class="form-group">

                <label>Status</label>

                <select>

                    <option>Active</option>

                    <option>Inactive</option>

                </select>

            </div>

        </div>

        <hr>

        <h2>Account Details</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Password</label>

   <input
    type="password"
    [(ngModel)]="userData.password"
    name="password"
    placeholder="Enter password">

            </div>
            @if (errorMessage) {
  <div class="error-message">
    {{ errorMessage }}
  </div>
}

            <div class="form-group">

                <label>Confirm Password</label>

             <input
    type="password"
    [(ngModel)]="userData.confirm_password"
    name="confirm_password"
    placeholder="Confirm password">

            </div>

        </div>

        <div class="button-group">

            <button type="button" class="cancel-btn"    routerLink="/user-detail">
              
                Cancel

            </button>

            <button
             type="button"
             class="create-btn"
            (click)="addUser()">

            Create User

        </button>

        </div>

    </div>
    @if(showSuccessPopup){

<div class="popup-overlay">

    <div class="popup">

        <div class="success-icon">✅</div>

        <h2>User Added Successfully!</h2>

        <p>
            The new user has been added to BuildTrack.
        </p>

        <button
                type="button"
            class="ok-btn"
            (click)="closePopup()">

            OK

        </button>

    </div>

</div>

}

</div>
