<div class="otp-page">

    <div class="overlay">

        <mat-card class="otp-card">

            <div class="lock-icon">
                🔒
            </div>

            <h2>Verify OTP</h2>

            <p class="subtitle">
                Enter the 6-digit OTP sent to your registered email address.
            </p>

            <form [formGroup]="otpForm">

                <div class="otp-boxes">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d1"
                    (input)="onInput($event,0)"
                    (keydown)="onBackspace($event,0)">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d2"
                    (input)="onInput($event,1)"
                    (keydown)="onBackspace($event,1)">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d3"
                    (input)="onInput($event,2)"
                    (keydown)="onBackspace($event,2)">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d4"
                    (input)="onInput($event,3)"
                    (keydown)="onBackspace($event,3)">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d5"
                    (input)="onInput($event,4)"
                    (keydown)="onBackspace($event,4)">

                    <input
                    #otpInput
                    maxlength="1"
                    formControlName="d6"
                    (input)="onInput($event,5)"
                    (keydown)="onBackspace($event,5)">

                </div>

                <button
  mat-raised-button
  class="verify-btn"
  [disabled]="otpForm.invalid"
  (click)="verifyOTP()">
  Verify OTP
</button>
<div class="resend">
  Didn't receive the OTP?
  <button
    type="button"
    class="resend-btn"
    (click)="resendOTP()">
    Resend OTP
  </button>
</div>

            </form>

            <a
            routerLink="/forgot-password"
            class="back-link">

                ← Back

            </a>

        </mat-card>

    </div>

</div>
