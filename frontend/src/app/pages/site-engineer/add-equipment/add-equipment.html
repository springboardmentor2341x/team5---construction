<div class="page-container">

  <div class="page-header">
<div>
      <button class="back-btn"
      routerLink="/site-engineer/equipment-status"
      > <b><- Back</b>
    </button>
    </div>
    <div>
      <h1>Add Equipment</h1>
      <p>Add a new equipment to the project inventory.</p>
    </div>
    

  </div>

  <div class="form-card">

    <form #equipmentForm="ngForm" (ngSubmit)="saveEquipment()">

      <div class="form-grid">

        <!-- Equipment Name -->
        <div class="form-group">
          <label>Equipment Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="equipment.name"
            required>
        </div>

        <!-- Equipment ID -->
        <div class="form-group">
          <label>Equipment ID</label>
          <input
            type="text"
            name="id"
            [(ngModel)]="equipment.id"
            required>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label>Category</label>

          <select
            name="category"
            [(ngModel)]="equipment.category">

            <option value="">Select Category</option>
            <option>Heavy Machinery</option>
            <option>Tools</option>
            <option>Vehicle</option>
            <option>Electrical</option>

          </select>
        </div>

        <!-- Project -->
        <div class="form-group">

          <label>Project</label>

          <input
            type="text"
            name="project"
            [(ngModel)]="equipment.project">

        </div>

        <!-- Quantity -->
        <div class="form-group">

          <label>Quantity</label>

          <input
            type="number"
            name="quantity"
            [(ngModel)]="equipment.quantity">

        </div>

        <!-- Condition -->
        <div class="form-group">

          <label>Condition</label>

          <select
            name="condition"
            [(ngModel)]="equipment.condition">

            <option>Good</option>
            <option>Average</option>
            <option>Needs Repair</option>

          </select>

        </div>

        <!-- Status -->
        <div class="form-group">

          <label>Status</label>

          <select
            name="status"
            [(ngModel)]="equipment.status">

            <option>Available</option>
            <option>In Use</option>
            <option>Maintenance</option>

          </select>

        </div>

        <!-- Purchase Date -->
        <div class="form-group">

          <label>Purchase Date</label>

          <input
            type="date"
            name="purchaseDate"
            [(ngModel)]="equipment.purchaseDate">

        </div>

      </div>

      <div class="button-group">

        <button
          type="button"
          class="cancel-btn"
          (click)="cancel()">

          Cancel

        </button>

        <button
          type="submit"
          class="save-btn">

          Save Equipment

        </button>

      </div>

    </form>

  </div>

</div>
