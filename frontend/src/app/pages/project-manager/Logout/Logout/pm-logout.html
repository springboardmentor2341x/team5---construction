<div class="logout-container">

  <div class="logout-card">

    <div class="logout-icon">
      🚪
    </div>

    <h2>Logout</h2>

    <p>
      Are you sure you want to logout from BuildTrack?
    </p>

    <div class="button-group">

      <button class="logout-btn"
              (click)="logout()">
        Logout
      </button>

      <button class="cancel-btn"
              (click)="cancel()">
        Cancel
      </button>

    </div>

  </div>

</div>
