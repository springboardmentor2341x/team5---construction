  </div>

  <div class="sidebar-section">

    <!-- DASHBOARD -->

      <span class="nav-icon">▦</span>
      <span>Dashboard</span>

    </a>


    <!-- BUDGET PLANNING -->
    <a
      routerLink="/budget-management/budget-planning"
      routerLinkActive="active"
      class="sidebar-link">

      <span>Budget Planning</span>

    <a

    <a
      routerLink="/budget-management/expense-management"
      routerLinkActive="active"
      class="sidebar-link">

      <span class="nav-icon">₹</span>
      <span>Expense Management</span>

      routerLink="/budget-management/budget-monitoring"
      routerLinkActive="active"
      class="sidebar-link">

      <span class="nav-icon">◔</span>
      <span>Budget Monitoring</span>

    </a>


    <!-- FINANCIAL SUMMARY -->
    <a
      routerLink="/budget-management/financial-summary"
      routerLinkActive="active"
      class="sidebar-link">

      <span class="nav-icon">▥</span>
      <span>Financial Summary</span>

    </a>

  <!-- BOTTOM SECTION -->

    <!-- SECURE ACCESS -->
    <div class="security-box">

      <div class="security-icon">
        ✓

      <div>
        <strong>Secure Access</strong>
        <small>Role-based financial access</small>
      </div>

    </div>
