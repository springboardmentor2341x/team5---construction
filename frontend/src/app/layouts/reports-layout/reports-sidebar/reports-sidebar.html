<aside class="reports-sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">

    <div class="brand-logo">
      BT
    </div>

    <div class="brand-info">
      <h2>BuildTrack</h2>
      <span>Project Management</span>
    </div>

  </div>


  <!-- Module Header -->
  <div class="module-header">
    <span>REPORTS & DOCUMENTATION</span>
  </div>


  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Reports Dashboard -->
    <a
      routerLink="/reports/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <span class="nav-icon">▦</span>
      <span class="nav-label">Reports Dashboard</span>

    </a>


    <!-- Project Progress -->
    <a
      routerLink="/reports/project-progress"
      routerLinkActive="active">

      <span class="nav-icon">↗</span>
      <span class="nav-label">Project Progress Report</span>

    </a>


    <!-- Resource Utilization -->
    <a
      routerLink="/reports/resources"
      routerLinkActive="active">

      <span class="nav-icon">⚙</span>
      <span class="nav-label">Resource Utilization Report</span>

    </a>


    <!-- Workforce Report -->
    <a
      routerLink="/reports/workforce"
      routerLinkActive="active">

      <span class="nav-icon">♙</span>
      <span class="nav-label">Workforce Report</span>

    </a>


    <!-- Procurement Report -->
    <a
      routerLink="/reports/procurement"
      routerLinkActive="active">

      <span class="nav-icon">▣</span>
      <span class="nav-label">Procurement Report</span>

    </a>


    <!-- Budget Report -->
    <a
      routerLink="/reports/budget"
      routerLinkActive="active">

      <span class="nav-icon">₹</span>
      <span class="nav-label">Budget Report</span>

    </a>


    <!-- Report Preview -->
    <a
      routerLink="/reports/preview"
      routerLinkActive="active">

      <span class="nav-icon">▤</span>
      <span class="nav-label">Report Preview</span>

    </a>

  </nav>


  <!-- Bottom Information -->
  <div class="sidebar-footer">

    <div class="security-card">

      <div class="security-icon">
        ✓
      </div>

      <div class="security-info">
        <strong>Secure Reports</strong>
        <span>Role-based access</span>
      </div>

    </div>

  </div>

</aside>
