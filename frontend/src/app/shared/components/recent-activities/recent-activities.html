<mat-card>

<h2>Recent Activities</h2>

<mat-list>

@for(activity of activities; track activity){

<mat-list-item>

<mat-icon matListItemIcon>{{activity.icon}}</mat-icon>

<div matListItemTitle>{{activity.text}}</div>

<div matListItemLine>{{activity.time}}</div>

</mat-list-item>

}

</mat-list>

</mat-card>
